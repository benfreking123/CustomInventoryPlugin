name: Build

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # allow the release step to upload the jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: custominventoryplugin-jar
          path: target/custominventoryplugin-*.jar
          if-no-files-found: error

      # On a version tag (e.g. v1.5.0) publish a GitHub Release with the jar.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/custominventoryplugin-*.jar
          generate_release_notes: true
