# Item type settings
item-types:
  form: Type # The form text (e.g., "Type: Ring")
  type: Ring # The type text (e.g., "Type: Ring")

# Tooltip frames (Docs/deisgn/tooltips.md)
tooltip:
  enabled: true
  namespace: tower
  # Also write the style path to custom_model_data strings[0], which the pack
  # draws as a tier-coloured glow behind the item in its slot.
  glow: true
  tiers:
    common: common
    uncommon: uncommon
    rare: rare
    mythic: mythic
    legendary: legendary
    tool: tool
    currency: currency
    resource: resource
    default: common
    superior: mythic
    fabled: legendary
    eternal: legendary
    cursed: common
    archieve: common
  item-ids: {}
  materials:
    WOODEN_HOE: tool
    STONE_HOE: tool
    IRON_HOE: tool
    GOLDEN_HOE: tool
    DIAMOND_HOE: tool
    NETHERITE_HOE: tool
    WOODEN_PICKAXE: tool
    STONE_PICKAXE: tool
    IRON_PICKAXE: tool
    GOLDEN_PICKAXE: tool
    DIAMOND_PICKAXE: tool
    NETHERITE_PICKAXE: tool
  sources:
    smithy_chunk_of_scrap: 'Craft lootboxes · Smithy · Merchants'
    smithy_flux_dust: 'Smithy · Mob drops'
    smithy_purge_salt: 'Smithy · Mob drops'
    smithy_core_flux: 'Smithy · Mob drops'
    smithy_chaos_shard: 'Smithy · Mob drops'
    smithy_ember: 'Smithy · Mob drops'
    smithy_lock_seal: 'Smithy · Mob drops'
    smithy_target_lock_seal: 'Smithy · Mob drops'
    smithy_targeting_prism: 'Smithy · Mob drops'
    dungeonkey_floor3: 'Quest reward · Floor 3'
    charged_crystal_small: 'Crafting · Quest rewards'
    charged_crystal_medium: 'Crafting · Quest rewards'
    charged_crystal_large: 'Crafting · Quest rewards'
    charged_crystal_full: 'Crafting · Quest rewards'
  # Derived attribute requirements (CIP feature; Divinity has no native support).
  # Set once per qualifying item and stored in PDC. The ATTRIBUTE is chosen from
  # the item's dominant rolled Fabled stat (see stat-attribute-map); the VALUE is
  # derived, not random:
  #   value = round(scale.base + scale.per-level * itemLevel) * tier-multiplier,
  #   clamped to [min, max].
  # Applies to Divinity items whose tier + id-type match below.
  attr-requirements:
    enabled: true
    min: 1
    max: 40
    scale:
      base: 0.0
      per-level: 1.0
      tier-multiplier:
        common: 1.0
        uncommon: 1.0
        rare: 1.2
        mythic: 1.4
        legendary: 1.6
    tiers: [common, uncommon]
    types: [sword, axe, bow, wand, hammer, helmet, chestplate, leggings, boots, cloak]
    attributes:
      base_strength: Strength
      base_dexterity: Dexterity
      base_intelligence: Intelligence
      base_vitality: Vitality
      base_agility: Agility
      base_wisdom: Wisdom
    # Which governing attribute each rolled Fabled stat points to. The item's
    # dominant mapped stat (by rolled magnitude) decides the required attribute.
    # Any base_<attr> stat maps to itself automatically; unlisted stats ignored.
    stat-attribute-map:
      damage_physical: base_strength
      damage_melee: base_strength
      damage_attack: base_strength
      stat_block_break: base_strength
      stat_knockback_resist: base_strength
      damage_projectile: base_dexterity
      base_attack_speed: base_dexterity
      stat_range: base_dexterity
      stat_attack_range: base_dexterity
      stat_crit_chance_attack: base_dexterity
      stat_crit_damage_attack: base_dexterity
      stat_crit_chance_projectile: base_dexterity
      stat_crit_damage_projectile: base_dexterity
      damage_spell: base_intelligence
      damage_fire: base_intelligence
      damage_ice: base_intelligence
      damage_lightning: base_intelligence
      damage_chaos: base_intelligence
      damage_area: base_intelligence
      damage_skill: base_intelligence
      stat_mana: base_intelligence
      stat_mana_mod: base_intelligence
      stat_crit_chance_spell: base_intelligence
      stat_crit_damage_spell: base_intelligence
      block_chance: base_intelligence
      stat_health: base_vitality
      stat_health_mod: base_vitality
      stat_armor: base_vitality
      stat_armor_mod: base_vitality
      stat_armor_toughness: base_vitality
      stat_absorption: base_vitality
      stat_heal_power: base_vitality
      defense_physical: base_vitality
      defense_fire: base_vitality
      defense_ice: base_vitality
      defense_lightning: base_vitality
      defense_chaos: base_vitality
      stat_move_speed: base_agility
      stat_jump: base_agility
      stat_mining_efficiency: base_agility
      dodge_chance: base_agility
      stat_mana_regen: base_wisdom
      stat_mana_regen_mod: base_wisdom
      stat_exp: base_wisdom
      stat_luck: base_wisdom

  # Skill-gem tooltip reflow: badge row [RARITY][GEM][ELEMENT] + Active/Passive
  # tag, description, then live stats from the connected Fabled skill
  # (Damage/Mana/Cooldown/Level). Frame follows the displayed "Tier:" rarity.
  gems:
    enabled: true
    id-prefixes: [gem_, passive_]
    # Skill types without an element pill glyph render as a colored text tag.
    type-colors:
      sigil: '&6'
      energy: '&e'
      movement: '&b'
      melee: '&7'
      projectile: '&6'
      resource: '&a'
      dynamic: '&d'
      passive: '&d'

# Critical hits for basic (non-skill) attacks on swords and bows.
#
# Applied inside Divinity's damage pipeline, not Fabled's, because Fabled runs
# first at HIGHEST priority and would only multiply the vanilla part of a hit
# rather than the elemental damage Divinity adds afterwards.
#
# The roll reads Fabled's crit attributes (base_crit_chance, stat_crit_chance,
# stat_crit_damage, plus the _attack / _projectile variants), so rings and gems
# feed basic attacks the same way they feed skills. Wands are excluded: they
# cast skills, which roll their own crit.
basic-attack-crit:
  enabled: true
  # Flat chance in percent before any attribute adds to it.
  base-chance: 2.0
  # Damage multiplier on a crit before stat_crit_damage adds to it.
  base-multiplier: 1.5
  message: '&c&lCRITICAL!'
