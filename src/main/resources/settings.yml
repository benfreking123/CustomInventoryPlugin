# Debug mode settings
debug:
  enabled: true
  log-level: DEBUG # DEBUG, INFO, WARNING, ERROR

general:
  override-e-key: true
  # Background filler pane for empty, non-interactive Gear Menu slots.
  fill-pane: GRAY_STAINED_GLASS_PANE
  # Pane shown in a skill-gem slot the player hasn't unlocked yet.
  locked-pane: RED_STAINED_GLASS_PANE

# How many skill-gem slots are usable with NO permission. The first N slots of
# each type (ordered left-to-right by position) are always open; every slot
# beyond N is locked until the player has that slot's `permission` node below.
skill-slots:
  default-active: 3
  default-passive: 2

# Armor slots (fixed positions)
armor-slots:
  helmet: 0
  chestplate: 9
  leggings: 18
  boots: 27

# Custom slots configuration
# Lore Format <form>: <type>
# `permission` (skill slots only): node that unlocks this slot once the player is
# past the default-open count. Leave blank for the always-free default slots.
custom-slots:
  slots:
    '0':
      enabled: true
      slot-type: attribute
      form: Type
      type: Ring
      position: 2
      lore_match: 'Type: Ring'
      permission: ''
    '1':
      enabled: true
      slot-type: attribute
      form: Type
      type: Ring
      position: 3
      lore_match: 'Type: Ring'
      permission: ''
    '2':
      enabled: true
      slot-type: attribute
      form: Type
      type: Amulet
      position: 11
      lore_match: 'Type: Bracelet'
      permission: ''
    '3':
      enabled: true
      slot-type: attribute
      form: Type
      type: Relic
      position: 12
      lore_match: 'Type: Relic'
      permission: ''
    '4':
      enabled: true
      slot-type: attribute
      form: Type
      type: Talisman
      position: 20
      lore_match: 'Type: Talisman'
      permission: ''
    '5':
      enabled: true
      slot-type: attribute
      form: Type
      type: Charm
      position: 21
      lore_match: 'Type: Charm'
      permission: ''
    # Active gem slots (positions 45-53). Default-open: first 3 (45, 46, 47).
    '6':
      enabled: true
      slot-type: skill
      form: Form
      type: Active
      position: 45
      lore_match: 'Form: Active'
      permission: ''
    '7':
      enabled: true
      slot-type: skill
      form: Form
      type: Active
      position: 46
      lore_match: 'Form: Active'
      permission: ''
    '8':
      enabled: true
      slot-type: skill
      form: Form
      type: Active
      position: 47
      lore_match: 'Form: Active'
      permission: ''
    '9':
      enabled: true
      slot-type: skill
      form: Form
      type: Active
      position: 48
      lore_match: 'Form: Active'
      permission: 'custominventory.skill.active.4'
    '10':
