# Debug mode settings
debug:
  enabled: true
  log-level: DEBUG # DEBUG, INFO, WARNING, ERROR

general:
  override-e-key: true
  # Background filler pane for empty, non-interactive Gear Menu slots.
  fill-pane: GRAY_STAINED_GLASS_PANE
  # Pane shown in a skill-gem slot the player hasn't unlocked yet.
  locked-pane: RED_STAINED_GLASS_PANE

# AutoPick: mob/harvest drops flash on the ground (owner-locked) before vacuum.
autopickup:
  ground-delay-ticks: 15

# AutoLoot — CIP is the server's authoritative drop manager (Divinity's `loot`
# module is disabled). force-all makes auto-pickup always-on for everyone
# (ignoring the per-player toggle + the autopickup permission); hide-toggle
# hides the now-redundant "Pickup On/Off" button in /bp. Effects give ground
# loot a rarity glow during the pop-out window; mythic/legendary also burst.
autoloot:
  force-all: true
  hide-toggle: true
  # How long mob loot stays visible on the ground (glowing) before it flies to
  # the player. Mining/fishing keep the snappier autopickup.ground-delay-ticks.
  ground-linger-ticks: 40
  blacklist:
    spawn-reasons: [SPAWNER]
    entity-types: [ARMOR_STAND]
  effects:
    enabled: true
    # Rarity-glow every ground item, not just AutoLoot pop-outs.
    all-ground-items: true
    burst-tiers: [mythic, legendary]
    tiers:
      common:    { glow: GRAY,         color: '#AAAAAA' }
      uncommon:  { glow: GREEN,        color: '#55FF55' }
      rare:      { glow: YELLOW,       color: '#FFFF55' }
      mythic:    { glow: LIGHT_PURPLE, color: '#FF55FF' }
      legendary: { glow: RED,          color: '#FF5555' }
      tool:      { glow: GOLD,         color: '#FFAA00' }
      currency:  { glow: YELLOW,       color: '#FFD966' }
      resource:  { glow: AQUA,         color: '#55FFFF' }
    aliases:
      default: common
      superior: mythic
      fabled: legendary
      eternal: legendary
      cursed: common
      archieve: common

# Food regen — what eating is FOR, now that it no longer heals.
#
# The natural_health_regeneration gamerule is false on every world, so vanilla's
# "a full hunger bar heals you" path is gone. Healing is the Natural
# Regeneration Fabled passive (1% of max HP per second). Eating adds a timed
# bonus to that passive's flat term, stat_health_regen_mod.
#
#   regen   — flat HP per second added while the buff lasts. Whole numbers only:
#             Fabled's getAttribute() returns an int, so 0.5 truncates to 0.
#   seconds — how long it lasts. Eating again REFRESHES, it does not stack.
#
# The same numbers are written onto the item's tooltip, so a food is documented
# by the entry that powers it. Reloadable with /ci reload.
#
# Only list plain vanilla food here. The tooltip rebuilds an item's lore
# wholesale to stay idempotent, which would wipe the lore off a Divinity
# consumable (the health potions in particular).
food-regen:
  enabled: true
  foods:
    BREAD:
      regen: 2
      seconds: 30
    COOKED_PORKCHOP:
      regen: 5
      seconds: 45

# Party GUI (/ci party) background art.
#   glyph — the char mapped to party_bg in Nexo interface.yml
#           (ꐷ / U+A437). It used to borrow codex_bg, the bestiary's frame,
#           which is why the party menu looked like the Compendium.
#   shift — horizontal pull-left (px) for the 256px frame. Pair with the
#           glyph's `ascent` in interface.yml when tuning vertical position.
party:
  display:
    glyph: "ꐷ"
    shift: 16

# How many skill-gem slots are usable with NO permission. The first N slots of
# each type (ordered left-to-right by position) are always open; every slot
# beyond N is locked until the player has that slot's `permission` node below.
skill-slots:
  default-active: 3
  default-passive: 2

# Armor slots (fixed positions)
armor-slots:
  helmet: 0
  chestplate: 9
  leggings: 18
  boots: 27

