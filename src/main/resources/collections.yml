# ============================================================
#  Collections — the Compendium's trophy tracker
#
#  Discovery is permanent: the first time a player obtains a
#  tracked item, CIP writes `collect.<category>.<id>` into
#  cip_counters (value = times seen). Selling or dropping the
#  item never removes the entry.
#
#  Armour sets are procedurally generated and have no stable
#  item id, so they are tracked per element through Divinity's
#  SetManager and live in their own `sets:` section below.
#
#  Generated from the Divinity item definitions — display names
#  and icons mirror the real items. Hot-reload with /ci reload.
# ============================================================

# Collections codex frame. Same geometry as the bestiary's codex_bg, but its
# tab plates are painted ACTIVE / PASSIVE / SETS / UNIQUE — so the tab order
# below must stay in step with the artwork.
display:
  glyph: "ꐫ"
  shift: 16

# Icon for an entry the player has not obtained yet. Every entry is always
# listed — a collection's job is to show what is still out there — so this is
# what marks a cell as empty. Accepts a Material or nexo:<item id>.
unknown-icon: "nexo:collection_unknown_icon"

# cip_counters key prefix (keys are <prefix><category>.<id>).
counter-prefix: "collect."

categories:
  active:
    display: "Active Gems"
    icon: NETHER_STAR
  passive:
    display: "Passive Gems"
    icon: AMETHYST_SHARD
  sets:
    display: "Armour Sets"
    icon: LEATHER_CHESTPLATE
  unique:
    display: "Unique Items"
    icon: TOTEM_OF_UNDYING

