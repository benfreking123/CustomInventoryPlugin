# ── Dungeons tab ─────────────────────────────────────────────
#  One tile per dungeon. Run counts come from cip_counters
#  (counter-key, fed by the MythicDungeons finish hook via
#  /cipcount). Discovered at 1 lifetime run; ops see everything.
dungeons:
  floor3_dungeon:
    display: "The Source"
    floor: 3
    icon: END_PORTAL_FRAME
    counter-key: "dungeon.floor3_dungeon"
    location: "Corrupted Savanna — sealed portal"
    lore:
      - "The corruption's wellspring beneath the"
      - "savanna. Entered with Nia's key; cleansed"
      - "when the Necromancer falls."
