# ============================================================
#  Bestiary — floors 1–4 (live combat roster)
#  Sources: MythicMobs/Mobs/floor{N}/ + Divinity drops/mobs/zone1/
#  Elite mythic ids are tracked separately but roll up into the
#  same entry for unlock thresholds.
#
#  Unlock tiers:
#    discovered @ 1 kill  → entry + locations
#    lore        @ 10
#    weaknesses  @ 50
#    drops       @ 100
# ============================================================

thresholds:
  discovered: 1
  lore: 10
  weaknesses: 50
  drops: 100

# Staff/dev reveal — anyone with this permission sees every entry and all
# detail tiers (Lore / Weaknesses / Drops). Real kill counts still display,
# and revealed-but-unearned entries are tagged "Revealed by permission".
# Registered in plugin.yml as default: op, so ops get it automatically.
reveal-permission: "custominventory.bestiary.reveal"

# Codex background (Nexo glyph) rendering for the bestiary GUI.
#   glyph  — the char mapped to codex_bg in Nexo interface.yml (ꐜ / U+A41C).
#   shift  — horizontal pull-left (px) for the 256px frame. Pair with the
#            glyph's `ascent` in interface.yml when tuning vertical position.
display:
  glyph: "ꐜ"
  shift: 16

